name: NOTE H873 - submit private CAL56 science to Kaggle
"on":
  push:
    branches: [main]
    paths:
      - "requests/h873/submit-*.txt"

permissions:
  contents: read

concurrency:
  group: note-h873-kaggle-science-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.NOTE_SOURCE_READ_TOKEN }}
      NOTE_SOURCE_BRANCH: codex/note-exactk-h873-kaggle-256-20261031
      NOTE_BRIDGE_SHA: ea3f52376567608a8ea9385e54c5391216c4837c
      NOTE_SCIENCE_SHA: 05ef09cf8d750b3dc0220d38f37b56f6328e52f5
    steps:
      - name: Fail closed unless both private access tokens exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "Missing KAGGLE_API_TOKEN"; exit 1; }
          test -n "${GH_TOKEN:-}" || { echo "Missing NOTE_SOURCE_READ_TOKEN"; exit 1; }
          echo "NOTE_H873_REQUIRED_SECRETS_PRESENT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Kaggle control-plane CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "kaggle==2.2.5"
      - name: Retrieve private NOTE code to ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          # An environment-only Git auth header is inherited by git's lazy
          # promisor fetches, without putting the token in command arguments,
          # the clone URL, .git/config or the public repository.
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC_AUTH"
          gh api repos/Andriamarosoa/note --silent
          echo "NOTE_SOURCE_TOKEN_AUTHENTICATED"
          git clone --filter=blob:none --depth=80 --single-branch --branch "$NOTE_SOURCE_BRANCH" \
            "https://github.com/Andriamarosoa/note.git" "$RUNNER_TEMP/note-private"
          cd "$RUNNER_TEMP/note-private"
          if ! git cat-file -e "$NOTE_BRIDGE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=80 origin "$NOTE_BRIDGE_SHA"
          fi
          if ! git cat-file -e "$NOTE_SCIENCE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=80 origin "$NOTE_SCIENCE_SHA"
          fi
          git cat-file -e "$NOTE_BRIDGE_SHA^{commit}"
          git cat-file -e "$NOTE_SCIENCE_SHA^{commit}"
          git checkout --detach "$NOTE_BRIDGE_SHA"
          test "$(git rev-parse HEAD)" = "$NOTE_BRIDGE_SHA"
          test -f research/exactk256/h873/kaggle_bridge/prepare_and_submit.py
          test -f research/exactk256/h873/kaggle_bridge/h873_dataset_runner.py
          python -m py_compile research/exactk256/h873/kaggle_bridge/prepare_and_submit.py research/exactk256/h873/kaggle_bridge/h873_dataset_runner.py
          (cd research/exactk256/h873/kaggle_bridge && python -m unittest -q test_bridge)
          echo "NOTE_H873_PINNED_PRIVATE_SOURCE_READY"
      - name: Stage a PRIVATE Kaggle dataset and submit the native256 replay
        shell: bash
        run: |
          set -euo pipefail
          # git archive below can fetch older missing blobs from a partial
          # clone. Use the same ephemeral header without persisting credentials.
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC_AUTH"
          cd "$RUNNER_TEMP/note-private"
          python research/exactk256/h873/kaggle_bridge/prepare_and_submit.py \
            --kaggle-owner "tinahandriamarosoa" \
            --run-id "$GITHUB_RUN_ID" \
            --stage "$RUNNER_TEMP/h873_stage_$GITHUB_RUN_ID" \
            --runner research/exactk256/h873/kaggle_bridge/h873_dataset_runner.py
          echo "NOTE_H873_KAGGLE_SUBMISSION_REQUESTED"
      - name: Science is not complete until private Kaggle result is verified
        run: |
          echo "This GitHub run only submits H873 to Kaggle."
          echo "No new Exact-K score is claimed. The Kaggle kernel must be verified separately."
