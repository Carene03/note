name: NOTE H875 inventory recoverable failed-run feature cache no download
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/note-h875-cache-inventory.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect all private Kaggle output file metadata with pagination
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5'
          python - <<'PY'
          import collections
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          ref='tinahandriamarosoa/note-h875-train224-k3-41202366684'
          token=None
          kinds=collections.Counter()
          saved_cache=0
          size_cache=0
          manifests=0
          total=0
          seen=set()
          for page in range(1,101):
              obj=api.kernels_list_files(ref,page_size=100,page_token=token)
              files=getattr(obj,'files',None)
              if files is None and isinstance(obj,dict):files=obj.get('files')
              files=files or []
              total+=len(files)
              for item in files:
                  if isinstance(item,dict):
                      name=item.get('ref') or item.get('name') or ''
                      size=item.get('size') or 0
                  else:
                      name=getattr(item,'ref',None) or getattr(item,'name','')
                      size=getattr(item,'size',0) or 0
                  name=str(name).lower()
                  for ext in ('.x.npy','.truth.npz','manifest.json','h875_selector_checkpoint.pt',
                              'h875_report.json','h875_manifest.json'):
                      if name.endswith(ext):kinds[ext]+=1
                  if 'native256_train224_cal56' in name:
                      saved_cache+=1
                      try:size_cache+=int(size)
                      except Exception:pass
                  if name.endswith('manifest.json'):manifests+=1
              more=(getattr(obj,'next_page_token',None) or getattr(obj,'nextPageToken',None))
              if more is None and isinstance(obj,dict):
                  more=obj.get('nextPageToken') or obj.get('next_page_token')
              if not more or more in seen:
                  print('H875_INVENTORY_PAGINATION_COMPLETE',page)
                  break
              seen.add(more);token=more
          else:
              print('H875_INVENTORY_PAGE_LIMIT_REACHED')
          print('H875_FAILED_KERNEL_OUTPUT_FILES',total)
          print('H875_CACHED_FILES_IN_PREPARED_TRAIN224_CAL56',saved_cache)
          print('H875_X_NPY_FEATURE_FILES',kinds['.x.npy'])
          print('H875_TRUTH_NPZ_FILES',kinds['.truth.npz'])
          print('H875_CACHE_MANIFESTS',manifests)
          print('H875_TRAINED_SELECTOR_CHECKPOINTS',kinds['h875_selector_checkpoint.pt'])
          print('H875_SAVED_FEATURE_CACHE_APPROX_BYTES',size_cache)
          print('H875_CACHE_POSSIBLY_REUSABLE',kinds['.x.npy']==280 and kinds['.truth.npz']==280)
          PY
